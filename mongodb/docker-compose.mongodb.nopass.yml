version: '3.4'

services:

  mongo_db:
    image: mongo:8.0
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_DATABASE=product
    volumes:
      - mongo_db_data2:/data/db
  
  mongo-express:
    image: mongo-express
    ports:
      - 3301:8081
    restart: always
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo_db
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
      - ME_CONFIG_MONGODB_PORT=27017
    depends_on:
      - mongo_db
volumes:
  mongo_db_data2:  