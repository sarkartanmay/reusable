version: "3.9"

services:
  redis:
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  redisinsight:
    image: redislabs/redisinsight:latest
    ports:
      - ${PUBLIC_RI_PORT}:8001
    depends_on:
      - redis
    volumes:
      - redisinsight-data:/db

volumes:
  redis-data:
  redisinsight-data:

networks:
  internal_app_communication:
    external: true
