version: "3.9"

services:
  auth:
    image: tanmaysarkar/basicauth:${APP_AUTH_VERSION}
    ports:
      - ${APP_AUTH_PORT}:80
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_AUTH_ENV}
      - ConnectionStrings__MySQLDB=${APP_AUTH_DB_CONFIG}
      - JWTConfig:Key=${JWT_KEY}
      - JWTConfig:Issuer=${JWT_ISS}
      - JWTConfig:Audience=${JWT_AUD}
      - ValidOrigin=${APP_ORIGIN}
    networks:
      - internal_app_communication

networks:
  internal_app_communication:
    external: true
