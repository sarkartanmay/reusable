version: '3.4'

services:
  tools_kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS}
    ports:
      - ${PUBLIC_KIBANA_PORT}:5601
    networks:
      - internal_app_communication

networks:
  internal_app_communication:
    external: true